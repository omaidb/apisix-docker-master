services:
  apisix: # 定义名为 apisix 的服务
    image: "apache/apisix:${APISIX_DOCKER_TAG}" # 使用 Apache APISIX 镜像，版本由环境变量 APISIX_DOCKER_TAG 指定
    restart: always # 服务失败时自动重启
    volumes: # 挂载卷配置
      - ./apisix_conf/master/config.yaml:/usr/local/apisix/conf/config.yaml:ro # 将本地配置文件挂载到容器内，设置为只读
    depends_on: # 定义服务依赖
      - etcd # 依赖 etcd 服务
    ports: # 映射端口
      - "9180:9180/tcp" # 将本地 9180 端口映射到容器的 9180 端口
      - "9080:9080/tcp" # 将本地 9080 端口映射到容器的 9080 端口
      - "9091:9091/tcp" # 将本地 9091 端口映射到容器的 9091 端口
      - "9443:9443/tcp" # 将本地 9443 端口映射到容器的 9443 端口
    networks: # 指定服务所属网络
      - apisix # 使用名为 apisix 的网络

  etcd: # 定义名为 etcd 的服务
    image: bitnami/etcd:3.4.9 # 使用 Bitnami 提供的 etcd 3.4.9 镜像
    user: root # 以 root 用户运行容器
    restart: always # 服务失败时自动重启
    volumes: # 挂载卷配置
      - ../example/etcd_data:/etcd_data # 将本地 etcd 数据目录挂载到容器内
    environment: # 配置环境变量
      ETCD_DATA_DIR: /etcd_data # 指定 etcd 数据目录
      ETCD_ENABLE_V2: "true" # 启用 etcd v2 API
      ALLOW_NONE_AUTHENTICATION: "yes" # 允许无认证访问
      ETCD_ADVERTISE_CLIENT_URLS: "http://0.0.0.0:2379" # 广播客户端访问 URL
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379" # 监听客户端访问 URL
    ports: # 映射端口
      - "2379:2379/tcp" # 将本地 2379 端口映射到容器的 2379 端口
    networks: # 指定服务所属网络
      - apisix # 使用名为 apisix 的网络

networks:
  apisix: # 定义名为 apisix 的网络
    driver: bridge # 使用 bridge 网络驱动
